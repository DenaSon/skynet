name: Prepare settings lockfile (temporary PR-only)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/spatie-settings-foundation-20261030'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the approved feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/spatie-settings-foundation-20261030
          persist-credentials: true
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Generate genuine Composer dependency lock
        run: composer require 'spatie/laravel-settings:^3.10' --no-interaction --no-progress --no-scripts
      - name: Commit only Composer manifest and lock to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add composer.json composer.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: lock Spatie Laravel settings dependency"
            git push origin HEAD:feature/spatie-settings-foundation-20261030
          fi
