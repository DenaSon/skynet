name: Temporary F09 Pint Formatter

on:
  push:
    branches:
      - feature/09b-telegram-subscription-builder

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: run F09 Pint autofix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/09b-telegram-subscription-builder
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Format F09 source and tests
        run: |
          vendor/bin/pint app/Interfaces/Telegram/Support/ShopUi.php tests/Feature/Sales/SalesOrderTest.php tests/Feature/Telegram/TelegramShopTest.php
      - name: Commit Pint output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Interfaces/Telegram/Support/ShopUi.php tests/Feature/Sales/SalesOrderTest.php tests/Feature/Telegram/TelegramShopTest.php
          git diff --cached --quiet && exit 0
          git commit -m "style(sales): apply official Laravel Pint formatting"
          git push origin HEAD:feature/09b-telegram-subscription-builder
