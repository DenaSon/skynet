# TEMPORARY bootstrap: delete this workflow once composer.lock is generated.
name: Tooling Lock Bootstrap

on:
  push:
    branches:
      - foundation/02-developer-tooling

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.head_commit.message == 'build: resolve foundation tooling lock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: foundation/02-developer-tooling

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install and lock developer tools
        run: |
          composer remove phpunit/phpunit --dev --no-update --no-interaction
          composer require --dev "pestphp/pest:^5.0" "pestphp/pest-plugin-laravel:^5.0" "larastan/larastan:^3.0" --with-all-dependencies --no-interaction --no-progress
          composer validate --no-check-publish
          php artisan test
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          vendor/bin/pint --test

      - name: Commit lockfile from Composer resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git diff --cached --exit-code && exit 0
          git commit -m "build: lock Pest and Larastan for PHP 8.4"
          git push origin HEAD:foundation/02-developer-tooling
