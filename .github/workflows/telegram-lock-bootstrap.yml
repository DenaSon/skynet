name: Temporary Telegram Dependency Lock

on:
  push:
    branches:
      - feature/04-telegram-foundation

permissions:
  contents: write

jobs:
  resolve:
    if: "github.event.head_commit.message == 'build: resolve Telegram dependency lock'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feature/04-telegram-foundation

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Resolve Nutgram dependencies without running app scripts
        run: |
          composer update nutgram/laravel --with-all-dependencies --no-install --no-scripts --no-interaction --no-progress
          composer validate --no-check-publish
          if grep -q 'mirror-composer.runflare.com' composer.lock; then
            echo 'Nonportable mirror URLs found.'
            exit 1
          fi

      - name: Commit Composer lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "build: lock Nutgram dependencies for PHP 8.4"
          git push origin HEAD:feature/04-telegram-foundation
