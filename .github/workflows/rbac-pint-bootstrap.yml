name: Temporary RBAC Pint Formatter

on:
  push:
    branches:
      - feature/06c-telegram-rbac

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: autoformat F06-C with Pint'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: feature/06c-telegram-rbac
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Apply Laravel Pint
        run: |
          vendor/bin/pint app/Interfaces/Telegram/Support/MenuRenderer.php app/Interfaces/Telegram/Support/RbacUi.php app/Modules/Identity/Application/RoleDirectoryPage.php app/Modules/Identity/Application/RoleEntry.php
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Interfaces/Telegram/Support/MenuRenderer.php app/Interfaces/Telegram/Support/RbacUi.php app/Modules/Identity/Application/RoleDirectoryPage.php app/Modules/Identity/Application/RoleEntry.php
          git diff --cached --quiet && exit 0
          git commit -m "style(rbac): apply project Pint rules"
          git push origin HEAD:feature/06c-telegram-rbac
