name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Verify portable Composer lockfile
        run: |
          if grep -qi 'mirror-composer.runflare.com' composer.lock; then
            echo 'ERROR: local Composer mirror URL found in composer.lock'
            exit 1
          fi

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Formatting verification
        run: |
          vendor/bin/pint --test || {
            vendor/bin/pint app/Interfaces/Telegram/Handlers/ReplyMenuHandler.php app/Interfaces/Telegram/Handlers/StartHandler.php app/Interfaces/Telegram/Support/ResellerBuilderUi.php
            git --no-pager diff -- app/Interfaces/Telegram/Handlers/ReplyMenuHandler.php app/Interfaces/Telegram/Handlers/StartHandler.php app/Interfaces/Telegram/Support/ResellerBuilderUi.php
            exit 1
          }
