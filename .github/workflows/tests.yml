name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect MySQL-sensitive changes
    runs-on: ubuntu-latest
    outputs:
      mysql: ${{ steps.detect.outputs.mysql }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Check changed paths (unknown changes require MySQL)
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "mysql=true" >> "${GITHUB_OUTPUT}"
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "Full compatibility and MySQL/Redis smoke required."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "mysql=false" >> "${GITHUB_OUTPUT}"
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "Fast PHP 8.4 checks only for push events."
            exit 0
          fi

          if [[ -z "${PR_NUMBER}" ]]; then
            echo "mysql=true" >> "${GITHUB_OUTPUT}"
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "PR number unavailable; fail closed to MySQL smoke."
            exit 0
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${RUNNER_TEMP}/pr_changed_files.txt"

          mysql=false
          docs_only=true
          if [[ ! -s "${RUNNER_TEMP}/pr_changed_files.txt" ]]; then
            mysql=true
            docs_only=false
          fi

          while IFS= read -r path; do
            case "${path}" in
              docs/*|README.md|AGENTS.md)
                ;;
              *)
                docs_only=false
                ;;
            esac

            case "${path}" in
              docs/*|README.md|AGENTS.md|app/Interfaces/Telegram/Support/SalesHomeUi.php|app/Interfaces/Telegram/Support/SalesSupportUi.php|app/Interfaces/Telegram/Support/SalesSubscriptionsUi.php|app/Interfaces/Telegram/Support/PlanCatalogUi.php|app/Interfaces/Telegram/Support/ResellerSalesReportUi.php|app/Interfaces/Telegram/Support/ResellerServiceHealthUi.php|app/Interfaces/Telegram/Support/TelegramUi.php|app/Interfaces/Telegram/Support/SalesNativeMenu.php|app/Interfaces/Telegram/Support/ReplyMenuLabels.php|app/Interfaces/Telegram/Support/ReplyMenuRenderer.php)
                ;;
              *)
                mysql=true
                echo "Requires MySQL/Redis smoke: ${path}"
                break
                ;;
            esac
          done < "${RUNNER_TEMP}/pr_changed_files.txt"

          echo "mysql=${mysql}" >> "${GITHUB_OUTPUT}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "Run MySQL/Redis smoke: ${mysql}"
          echo "Documentation-only PR: ${docs_only}"

  docs-validation:
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only == 'true' }}
    name: Documentation-only validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check documentation diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"

  tests:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - name: Run PHP 8.4 and frontend validation
        uses: ./.github/actions/php-validation
        with:
          php-version: '8.4'
          run-frontend: 'true'

  php85:
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: PHP 8.5
    runs-on: ubuntu-latest
    steps:
      - name: Run full PHP 8.5 compatibility suite
        uses: ./.github/actions/php-validation
        with:
          php-version: '8.5'
          run-frontend: 'false'

  static-analysis:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  formatting:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    name: Formatting verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Formatting verification
        run: vendor/bin/pint --test -v

  mysql-migration:
    needs: changes
    if: ${{ needs.changes.outputs.mysql == 'true' }}
    name: MySQL migration and rollback
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skynet_mb02_ci
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: skynet_mb02_ci
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      MB02_MYSQL_SMOKE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, pdo_mysql, redis
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate test application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate disposable MySQL database
        run: php artisan migrate --force

      - name: Verify consistent KPI snapshots on MySQL
        env:
          KPI_MYSQL_SMOKE: '1'
        run: php tests/Smoke/kpi_mysql_snapshot.php

      - name: Verify real Redis provider queue and legacy database drain
        env:
          PROVIDER_REDIS_SMOKE: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_DB: '15'
        run: php tests/Smoke/provider_queue_redis.php

      - name: Verify trial admission contention and evidence retention on MySQL
        env:
          TRIAL_MYSQL_SMOKE: '1'
        run: php tests/Smoke/trial_mysql_concurrency.php

      - name: Verify concurrent wallet payment safety on MySQL REPEATABLE READ
        env:
          PAYMENT_MYSQL_SMOKE: '1'
        run: php tests/Smoke/payment_wallet_mysql_concurrency.php

      - name: Verify referral reward cap and duplicate credit safety on MySQL
        env:
          REFERRAL_MYSQL_SMOKE: '1'
        run: php tests/Smoke/referral_mysql_concurrency.php

      - name: Verify referral reward dispatch through a real Redis worker
        env:
          REFERRAL_REDIS_SMOKE: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_DB: '15'
        run: php tests/Smoke/referral_queue_redis.php

      - name: Verify FLT-01 concurrent incident safety and guarded rollback on MySQL
        env:
          FILTERING_MYSQL_SMOKE: '1'
        run: php tests/Smoke/filtering_mysql.php

      - name: Validate historical receipts and guarded rollback on MySQL
        run: php tests/Smoke/mb02_mysql_migration.php

      - name: Validate MB-05A and MB-05B historical upgrade and rollback guards
        run: php tests/Smoke/mb06a_mysql_safety.php
