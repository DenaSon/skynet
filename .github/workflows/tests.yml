name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Verify portable Composer lockfile
        run: |
          if grep -qi 'mirror-composer.runflare.com' composer.lock; then
            echo 'ERROR: local Composer mirror URL found in composer.lock'
            exit 1
          fi

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Formatting verification
        run: vendor/bin/pint --test -v


  mysql-migration:
    name: MySQL migration and rollback
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skynet_mb02_ci
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: skynet_mb02_ci
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      MB02_MYSQL_SMOKE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, pdo_mysql, redis
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate test application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate disposable MySQL database
        run: php artisan migrate --force

      - name: Verify real Redis provider queue and legacy database drain
        env:
          PROVIDER_REDIS_SMOKE: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_DB: '15'
        run: php tests/Smoke/provider_queue_redis.php

      - name: Verify trial admission contention and evidence retention on MySQL
        env:
          TRIAL_MYSQL_SMOKE: '1'
        run: php tests/Smoke/trial_mysql_concurrency.php

      - name: Verify concurrent wallet payment safety on MySQL REPEATABLE READ
        env:
          PAYMENT_MYSQL_SMOKE: '1'
        run: php tests/Smoke/payment_wallet_mysql_concurrency.php

      - name: Verify referral reward cap and duplicate credit safety on MySQL
        env:
          REFERRAL_MYSQL_SMOKE: '1'
        run: php tests/Smoke/referral_mysql_concurrency.php

      - name: Verify referral reward dispatch through a real Redis worker
        env:
          REFERRAL_REDIS_SMOKE: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_DB: '15'
        run: php tests/Smoke/referral_queue_redis.php

      - name: Validate historical receipts and guarded rollback on MySQL
        run: php tests/Smoke/mb02_mysql_migration.php

      - name: Validate MB-05A and MB-05B historical upgrade and rollback guards
        run: php tests/Smoke/mb06a_mysql_safety.php
