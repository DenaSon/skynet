name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect MySQL-sensitive changes
    runs-on: ubuntu-latest
    outputs:
      mysql: ${{ steps.detect.outputs.mysql }}
    steps:
      - name: Check changed paths (unknown changes require MySQL)
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "mysql=true" >> "${GITHUB_OUTPUT}"
            echo "Full MySQL smoke required for push/scheduled run."
            exit 0
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > "${RUNNER_TEMP}/pr_changed_files.txt"
          mysql=false
          if [[ ! -s "${RUNNER_TEMP}/pr_changed_files.txt" ]]; then
            mysql=true
          fi
          while IFS= read -r path; do
            case "${path}" in
              docs/*|README.md|AGENTS.md|app/Interfaces/Telegram/Support/SalesHomeUi.php|app/Interfaces/Telegram/Support/SalesSupportUi.php|app/Interfaces/Telegram/Support/SalesSubscriptionsUi.php|app/Interfaces/Telegram/Support/PlanCatalogUi.php|app/Interfaces/Telegram/Support/ResellerSalesReportUi.php|app/Interfaces/Telegram/Support/ResellerServiceHealthUi.php|app/Interfaces/Telegram/Support/TelegramUi.php|app/Interfaces/Telegram/Support/SalesNativeMenu.php|app/Interfaces/Telegram/Support/ReplyMenuLabels.php|app/Interfaces/Telegram/Support/ReplyMenuRenderer.php|tests/Feature/Telegram/*)
                ;;
              *)
                mysql=true
                echo "Requires MySQL: ${path}"
                break
                ;;
            esac
          done < "${RUNNER_TEMP}/pr_changed_files.txt"
          echo "mysql=${mysql}" >> "${GITHUB_OUTPUT}"
          echo "Run MySQL smoke: ${mysql}"

  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(github.event_name == 'schedule' && '["8.4","8.5"]' || '["8.4"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Verify portable Composer lockfile
        run: |
          if grep -qi 'mirror-composer.runflare.com' composer.lock; then
            echo 'ERROR: local Composer mirror URL found in composer.lock'
            exit 1
          fi

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Execute tests
        run: php artisan test

      - name: Verify Livewire production JavaScript bundle
        if: matrix.php == '8.4'
        run: |
          npm install --ignore-scripts --no-fund --no-audit --package-lock=false
          npm run build
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('public/build/manifest.json', 'utf8'));
          const live = manifest['resources/js/live.js'];
          if (!live || !live.isEntry || !live.file || !live.file.endsWith('.js')) {
            throw new Error('Livewire Vite entry missing from production manifest');
          }
          const filename = 'public/build/' + live.file;
          if (!fs.existsSync(filename) || fs.statSync(filename).size < 30000) {
            throw new Error('Livewire runtime JavaScript bundle missing or unexpectedly empty');
          }
          // P0 contract: the ten unused-yet component primitives must survive production CSS generation.
          const style = manifest['resources/css/app.css'];
          if (!style || !style.file || !style.file.endsWith('.css')) {
            throw new Error('DenaGate Live stylesheet missing from production manifest');
          }
          const css = fs.readFileSync('public/build/' + style.file, 'utf8');
          const primitives = ['dg-card', 'dg-card-accent', 'dg-stat', 'dg-btn-primary',
            'dg-btn-secondary', 'dg-field', 'dg-status', 'dg-heading', 'dg-empty', 'dg-nav-item'];
          for (const primitive of primitives) {
            if (!css.includes('.denagate-live .'+ primitive)) {
              throw new Error('Missing scoped P0 primitive in compiled CSS: ' + primitive);
            }
          }
          NODE

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  formatting:
    name: Formatting verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php8.4-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Formatting verification
        run: vendor/bin/pint --test -v

  mysql-migration:
    needs: changes
    if: ${{ needs.changes.outputs.mysql == 'true' }}
    name: MySQL migration and rollback
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: skynet_mb02_ci
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: skynet_mb02_ci
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      MB02_MYSQL_SMOKE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, gd, mbstring, zip, pcntl, pdo, pdo_mysql, redis
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php'8.4'-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate test application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate disposable MySQL database
        run: php artisan migrate --force

      - name: Verify real Redis provider queue and legacy database drain
        env:
          PROVIDER_REDIS_SMOKE: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_DB: '15'
        run: php tests/Smoke/provider_queue_redis.php

      - name: Verify trial admission contention and evidence retention on MySQL
        env:
          TRIAL_MYSQL_SMOKE: '1'
        run: php tests/Smoke/trial_mysql_concurrency.php

      - name: Verify concurrent wallet payment safety on MySQL REPEATABLE READ
        env:
          PAYMENT_MYSQL_SMOKE: '1'
        run: php tests/Smoke/payment_wallet_mysql_concurrency.php

      - name: Verify referral reward cap and duplicate credit safety on MySQL
        env:
          REFERRAL_MYSQL_SMOKE: '1'
        run: php tests/Smoke/referral_mysql_concurrency.php

      - name: Verify referral reward dispatch through a real Redis worker
        env:
          REFERRAL_REDIS_SMOKE: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_DB: '15'
        run: php tests/Smoke/referral_queue_redis.php

      - name: Validate historical receipts and guarded rollback on MySQL
        run: php tests/Smoke/mb02_mysql_migration.php

      - name: Validate MB-05A and MB-05B historical upgrade and rollback guards
        run: php tests/Smoke/mb06a_mysql_safety.php
