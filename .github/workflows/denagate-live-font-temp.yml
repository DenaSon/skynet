name: DenaGate Live font import (temporary)
on:
  push:
    branches: [feature/denagate-live-light-ui-vazirmatn-20261030]
permissions:
  contents: write
jobs:
  font:
    if: "!contains(github.event.head_commit.message, 'font assets imported')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream Vazirmatn variable font and OFL license
        run: |
          set -euo pipefail
          mkdir -p public/fonts
          curl --fail --location --silent --show-error --retry 3 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2' -o public/fonts/vazirmatn-variable.woff2
          curl --fail --location --silent --show-error --retry 3 'https://raw.githubusercontent.com/rastikerdar/vazirmatn/6e553e33489a8f9dfaccc76860a2e3f3c1e66de7/OFL.txt' -o public/fonts/OFL-Vazirmatn.txt
          test "$(git hash-object public/fonts/vazirmatn-variable.woff2)" = a501289a85595158570b0c2badcb4608b042e748
          test "$(git hash-object public/fonts/OFL-Vazirmatn.txt)" = be66b3824e9772e75141e631695c5256f105fb57
          test "$(wc -c < public/fonts/vazirmatn-variable.woff2)" -gt 100000
      - name: Commit licensed font asset on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fonts/vazirmatn-variable.woff2 public/fonts/OFL-Vazirmatn.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build(live): font assets imported from pinned Vazirmatn upstream'
          git push origin HEAD:feature/denagate-live-light-ui-vazirmatn-20261030
